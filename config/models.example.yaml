# 模型清单示例：复制成 config/models.yaml，按自己的机器改。加模型、换模型、改参数都只改 models.yaml。
#   - 调度器（llama-swap）的配置 config/llama-swap.yaml 由 scripts/gen_models.py 按它生成，开机脚本启动前也会自动生成一次。
#   - 网页服务启动时读它：对话页列哪些模型、各功能用哪个、Agent 的上下文、能不能看图、设置页的模型表。改完要重启网页服务。
#   - 模型和程序：双击 安装.bat，或者 hub\.venv\Scripts\python.exe scripts\download_models.py，按功能分组选着下；
#     网页设置页的“模型”卡片里也能下。llama.cpp、llama-swap、ComfyUI 缺了会一起装到下面 paths 写的位置。
# 相对路径按项目根目录算，一律用正斜杠。
# 下面是作者机器（12 GB 显存、64 GB 内存）上的选择。显存、内存小的话换小一点的量化或模型（改 llama.model 和 download）。

paths:
  llama_server: bin/llama.cpp/llama-server.exe     # llama.cpp 的 llama-server（下载脚本按显卡驱动装 CUDA 13 或 12 版）
  models: models                                   # 模型文件的根目录，下面 llama.model 都相对它
  python: hub/.venv/Scripts/python.exe             # 跑 launcher 启动脚本用的 Python
  comfy: bin/ComfyUI/ComfyUI                       # ComfyUI 本体（main.py 和 models 所在）；已经装过 ComfyUI 就改成它的位置。不用图像就删掉这行和 comfyui_auto
  comfy_python: bin/ComfyUI/python_embeded/python.exe  # ComfyUI 便携版自带的 Python；不写就用 comfy 旁边的 python_embeded

scheduler:
  idle_unload: 900        # 显卡上的模型空闲多少秒后自动卸载
  health_timeout: 300     # 加载多久还没好算失败（大模型第一次加载较慢）
  cpu_threads: 8          # CPU 常驻模型用几个线程

# 各功能用哪个模型（值是下面 models 里的 id）。chat、fast 必须有。
roles:
  chat: qwen3.6-35b-a3b             # 新对话默认、识字后的追问、桌宠台词
  fast: qwen3.5-9b-cpu              # 标题、标签转换、随手问、记忆整理（最好放 CPU 上常驻）
  ja_zh: sakura-14b-qwen3-v1.5      # 日→中翻译
  translate: hy-mt2-7b              # 其他语言翻译
  ocr: paddleocr-vl-1.6             # 识字
  embed: qwen3-embedding-0.6b       # 知识库向量
  rerank: qwen3-reranker-0.6b       # 知识库重排
  image: comfyui_auto               # 图像（图片、视频；id 保持 comfyui_auto：网页走调度器的 /comfyui/ 地址调它，换别的名字没测过）

# 下载分组：下载脚本和设置页按组列出、按组下载。模型写 group，download 里某一项也可以单独写 group。
download_groups:
  基础:   {desc: 对话、Agent、看图、快速模型、知识库, required: true}
  翻译:   {desc: 日→中（Sakura）和其他语言（Hy-MT2）}
  识字:   {desc: 截图、文档 OCR}
  图片:   {desc: 生成图片（NoobAI、Anima）和放大，要 ComfyUI}
  改图:   {desc: Qwen-Image 2.1：按一句话改图，也能生成写实、带文字的图，要 ComfyUI}
  视频:   {desc: 生成带声音的视频（MiniMax H3 + 加速 LoRA），要 ComfyUI 和 12 GB 以上显存}
  FastH3: {desc: 视频的另一个模型，动作更大，可选}

# 每个模型的字段：
#   name        短名字（状态栏、对话页、模型表）        title    调度器里的全名（可选）
#   menu        写了就出现在对话页的模型列表里，值是旁边的说明（写 true 表示不要说明）
#   device      gpu（默认，显卡上同一时间只放一个，切换时卸载上一个）或 cpu（常驻内存，不占显存）
#   vision      能不能看图（Agent 截图、贴图要用）       agent_ctx  Agent 自己用多少上下文（比 ctx 少 8k 左右，留给验收员）
#   think_limit 思考最多多少 token 算正常（不写按 2500）  size     占用说明，模型表里显示
#   启动方式三选一：
#     llama:    {model, mmproj, ctx, args}  用 llama-server 跑；model、mmproj 相对 paths.models；args 是其余参数
#     launcher: scripts/xxx.py              自己写的启动脚本，调度器用 paths.python 跑「脚本 端口」；可以再写 python: 换解释器
#     comfyui:  true                        按 paths.comfy 启动 ComfyUI
#   ttl         这个模型自己的空闲卸载秒数              check    调度器判断启动好了的地址（launcher 常用 /v1/models）
#   unlisted    不出现在调度器的模型列表里              big、no_tokenize、startup_check  特殊的引擎才用，见 hub/app/agent.py
#   group       下载分组（见 download_groups）
#   download    要下的文件：{repo, file, to} 或 {url, sha256, to}；repo 和 file 是 HuggingFace 上的，url 是别的地址（sha256 可选，用来校验）。
#               to 不写就放 llama.model 所在文件夹，写了就放 paths.models/<to>；comfy:子目录 表示放 ComfyUI 的 models/子目录
#               （extra_model_paths.yaml 给这个子目录配了别的文件夹的话，放那里）。某一项可以单独写 group

models:
  # ---------- 显卡 ----------
  qwen3.6-35b-a3b:
    group: 基础
    name: Qwen3.6 35B
    title: Qwen3.6 35B-A3B（主力：日常 / Agent / 看图）
    menu: 默认
    vision: true
    agent_ctx: 90112
    think_limit: 8000
    size: 21.4 GB，显卡 + 内存
    llama:
      model: llm/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
      mmproj: llm/qwen3.6-35b-a3b/mmproj-F16.gguf
      ctx: 98304
      args: -ctk q8_0 -ctv q8_0 -ub 2048 -b 2048 --spec-type ngram-mod --temp 0.6 --top-p 0.95 --top-k 20 --min-p 0
    download:
      - {repo: unsloth/Qwen3.6-35B-A3B-GGUF, file: Qwen3.6-35B-A3B-UD-Q4_K_M.gguf}
      - {repo: unsloth/Qwen3.6-35B-A3B-GGUF, file: mmproj-F16.gguf}

  hy-mt2-7b:
    group: 翻译
    name: Hy-MT2 7B
    title: Hy-MT2 7B（通用翻译）
    size: 7.4 GB
    llama:
      model: llm/hy-mt2-7b/HY-MT2-7B-Q8_0.gguf
      ctx: 16384
      args: --temp 0.7 --top-p 0.6 --top-k 20 --repeat-penalty 1.05
    download:
      - {repo: tencent/Hy-MT2-7B-GGUF, file: HY-MT2-7B-Q8_0.gguf}

  sakura-14b-qwen3-v1.5:
    group: 翻译
    name: Sakura 14B
    title: Sakura 14B Qwen3 v1.5（日→中，游戏/小说）
    size: 7.6 GB
    llama:
      model: llm/sakura-14b-qwen3-v1.5/sakura-14b-qwen3-v1.5-iq4xs.gguf
      ctx: 8192
      args: --temp 0.1 --top-p 0.3
    download:
      - {repo: SakuraLLM/Sakura-14B-Qwen3-v1.5-GGUF, file: sakura-14b-qwen3-v1.5-iq4xs.gguf}

  paddleocr-vl-1.6:
    group: 识字
    name: PaddleOCR
    title: PaddleOCR-VL 1.6（文档 / 截图 OCR）
    vision: true
    size: 1.7 GB
    llama:
      model: ocr/paddleocr-vl-1.6/PaddleOCR-VL-1.6-GGUF.gguf
      mmproj: ocr/paddleocr-vl-1.6/PaddleOCR-VL-1.6-GGUF-mmproj.gguf
      ctx: 8192
      args: --temp 0
    download:
      - {repo: PaddlePaddle/PaddleOCR-VL-1.6-GGUF, file: PaddleOCR-VL-1.6-GGUF.gguf}
      - {repo: PaddlePaddle/PaddleOCR-VL-1.6-GGUF, file: PaddleOCR-VL-1.6-GGUF-mmproj.gguf}

  comfyui_auto:
    name: ComfyUI 图像
    title: ComfyUI 图片 / 视频
    comfyui: true
    ttl: 600
    check: /
    unlisted: true
    size: 看所用的图像模型
    download:
      # 图片：生成（NoobAI、Anima）、放大（RealESRGAN 不在 HuggingFace，用 GitHub 发布页的地址）
      - {group: 图片, repo: Laxhar/noobai-XL-Vpred-1.0, file: NoobAI-XL-Vpred-v1.0.safetensors, to: comfy:checkpoints}
      - {group: 图片, repo: Gazingstars123/Anima-2.9B, file: Anima-2.9B-preview-v1_int8_convrot.safetensors, to: comfy:diffusion_models}
      - {group: 图片, repo: circlestone-labs/Anima, file: split_files/text_encoders/qwen_3_06b_base.safetensors, to: comfy:text_encoders}
      - {group: 图片, repo: circlestone-labs/Anima, file: split_files/vae/qwen_image_vae.safetensors, to: comfy:vae}
      - {group: 图片, url: "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth",
         sha256: f872d837d3c90ed2e05227bed711af5671a6fd1c9f7d7e91c911a61f155e99da, to: comfy:upscale_models}
      # 改图
      - {group: 改图, repo: Comfy-Org/Qwen-Image-2.1, file: diffusion_models/qwen_image_2.1_turbo_int8_convrot.safetensors, to: comfy:diffusion_models}
      - {group: 改图, repo: Comfy-Org/Qwen-Image-2.1, file: text_encoders/qwen3vl_8b_int8_convrot.safetensors, to: comfy:text_encoders}
      - {group: 改图, repo: Comfy-Org/Qwen-Image-2.1, file: vae/qwen_image_2.1_vae_bf16.safetensors, to: comfy:vae}
      # 视频：MiniMax H3（首尾帧 / 文生视频，自带声音）+ 加速 LoRA（6 步，快 2.5 倍）
      - {group: 视频, repo: Comfy-Org/MiniMax-H3, file: diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors, to: comfy:diffusion_models}
      - {group: 视频, repo: Comfy-Org/MiniMax-H3, file: text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors, to: comfy:text_encoders}
      - {group: 视频, repo: Comfy-Org/MiniMax-H3, file: vae/minimax_h3_video_vae_fp16.safetensors, to: comfy:vae}
      - {group: 视频, repo: Comfy-Org/MiniMax-H3, file: vae/minimax_h3_audio_vae_fp32.safetensors, to: comfy:vae}
      - {group: 视频, repo: lightx2v/Minimax-h3-Turbo, file: minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors, to: comfy:loras}
      - {group: FastH3, repo: FastVideo/FastVideo-FastH3-Comfy, file: diffusion_models/fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors, to: comfy:diffusion_models}

  # ---------- CPU 常驻 ----------
  qwen3.5-9b-cpu:
    group: 基础
    name: Qwen3.5 9B
    title: Qwen3.5 9B（CPU 常驻快模型）
    menu: 内存常驻，不占显卡
    device: cpu
    agent_ctx: 16384
    size: 5.3 GB 内存
    llama:
      model: llm/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
      ctx: 16384
      args: --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0 --reasoning-budget 0
    download:
      - {repo: unsloth/Qwen3.5-9B-GGUF, file: Qwen3.5-9B-Q4_K_M.gguf}

  qwen3-embedding-0.6b:
    group: 基础
    name: 向量模型 0.6B
    title: Qwen3 Embedding 0.6B（知识库向量）
    device: cpu
    size: 0.6 GB 内存
    llama:
      model: embed/qwen3-embedding-0.6b/Qwen3-Embedding-0.6B-Q8_0.gguf
      ctx: 8192
      args: --embedding
    download:
      - {repo: Qwen/Qwen3-Embedding-0.6B-GGUF, file: Qwen3-Embedding-0.6B-Q8_0.gguf}

  qwen3-reranker-0.6b:
    group: 基础
    name: 重排模型 0.6B
    title: Qwen3 Reranker 0.6B（知识库重排）
    device: cpu
    size: 0.6 GB 内存
    llama:
      model: embed/qwen3-reranker-0.6b/qwen3-reranker-0.6b-q8_0.gguf
      ctx: 8192
      args: --rerank
    download:
      - {repo: ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF, file: qwen3-reranker-0.6b-q8_0.gguf}
